name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: shabari
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sws_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shabari" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      PGPASSWORD: ci-only-password
      DATABASE_URL: postgresql://shabari:ci-only-password@127.0.0.1:5432/sws_dev
      DIRECT_URL: postgresql://shabari:ci-only-password@127.0.0.1:5432/sws_dev
      TEST_DATABASE_URL: postgresql://shabari:ci-only-password@127.0.0.1:5432/sws_test
      E2E_DATABASE_URL: postgresql://shabari:ci-only-password@127.0.0.1:5432/sws_e2e
      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - name: No environment, local or Vercel files are tracked
        run: bash scripts/check-tracked-files.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create test databases
        run: |
          psql -h 127.0.0.1 -U shabari -d sws_dev -c "create database sws_test" -c "create database sws_e2e"
      - name: Migrate and seed dev database (needed by build-time prerendering)
        run: npx prisma migrate deploy && npx tsx prisma/seed.ts --publish-samples
      - run: npx next typegen
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit and integration tests
        run: npx vitest run
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (production build)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
